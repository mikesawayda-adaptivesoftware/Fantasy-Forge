<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FantasyForge – Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0f; color: #f0f0f5; font-family: system-ui, sans-serif; text-align: center; }
      h1 { color: #10b981; margin: 0.5rem 0; }
      p { color: #9ca3af; max-width: 28rem; padding: 0 1rem; }
      button { margin-top: 1rem; padding: 0.6rem 1.2rem; border: 0; border-radius: 0.5rem; background: #10b981; color: #000; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div style="font-size: 3rem">🏈</div>
      <h1>You're offline</h1>
      <p>FantasyForge needs a connection for live scores and projections. Pages you've opened recently will still load.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
